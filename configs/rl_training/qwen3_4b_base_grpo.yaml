# GRPO training for Qwen3-4B-Base (paper §4.1).
#
# The RL model is trained directly from the base model, with no supervised
# fine-tuning, using GRPO in verl on DAPO-Math-17k. All three model pairs in the
# paper use verl's default GRPO hyperparameters; the values spelled out below
# are the ones §4.1 states, so that a reader does not have to infer them from a
# framework default that may change between verl versions.
#
# Checkpoint selection: the checkpoint with the highest accuracy on a validation
# set drawn from DAPO-Math-17k, so that no evaluation benchmark is used for
# selection. For this pair that is step 460.
#
# Usage:
#   python -m verl.trainer.main_ppo --config-path configs/rl_training \
#       --config-name qwen3_4b_base_grpo
#
# Paths are placeholders: point them at your own checkpoint and data locations.

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false

data:
  train_files: ${oc.env:DAPO_MATH_17K_TRAIN}
  val_files: ${oc.env:DAPO_MATH_17K_VAL}
  # 128 prompts per step, 8 rollouts each (§4.1)
  train_batch_size: 128
  max_prompt_length: 2048
  max_response_length: 8192
  prompt_key: prompt
  truncation: error

actor_rollout_ref:
  model:
    path: ${oc.env:QWEN3_4B_BASE_PATH}
    use_remove_padding: true
    enable_gradient_checkpointing: true
  actor:
    optim:
      # Constant learning rate of 1e-6 (§4.1): no warmup, no decay.
      lr: 1.0e-6
      lr_warmup_steps_ratio: 0.0
      warmup_style: constant
    ppo_mini_batch_size: 128
    use_kl_loss: false
    entropy_coeff: 0.0
    clip_ratio: 0.2
  rollout:
    name: vllm
    # 8 rollouts per prompt (§4.1)
    n: 8
    temperature: 1.0
    top_p: 1.0
    gpu_memory_utilization: 0.6
    tensor_model_parallel_size: 2
    # Rollout batching throughput only; the response budget is
    # data.max_response_length above (8,192 tokens, §4.1).
    max_num_batched_tokens: 16384

reward_model:
  # Outcome reward only: +1 for a correct final answer, -1 otherwise (§4.1).
  # The rollout prompt asks for "Answer: $Answer" on the last line, which is the
  # format distributed with DAPO-Math-17k; see wrb/prompts.py.
  enable: false
  reward_manager: dapo

custom_reward_function:
  path: null
  name: null

trainer:
  total_epochs: 1
  # The paper trains for 460 / 320 / 500 steps for Qwen3-4B / Qwen3-8B /
  # Llama-3.2-3B and selects the best validation checkpoint among them.
  total_training_steps: 600
  save_freq: 20
  test_freq: 20
  critic_warmup: 0
  logger: [console]
  project_name: what-rl-brings
  experiment_name: qwen3_4b_base_grpo
  n_gpus_per_node: 8
  nnodes: 1
