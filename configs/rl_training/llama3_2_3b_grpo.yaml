# GRPO training for Llama-3.2-3B (paper §4.1).
#
# Same recipe as the Qwen3 pairs. Llama-3.2-3B uses its own chat template at
# evaluation time (Appendix D); the training rollout prompt is unchanged.
# Selected checkpoint: step 500.

defaults:
  - qwen3_4b_base_grpo
  - _self_

actor_rollout_ref:
  model:
    path: ${oc.env:LLAMA32_3B_PATH}
  rollout:
    tensor_model_parallel_size: 2

trainer:
  experiment_name: llama3_2_3b_grpo
  total_training_steps: 600
