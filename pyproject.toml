[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wrb"
version = "0.1.0"
description = "Diagnostics for what RL adds to a base language model: rl-replace, power sampling, opening cues, and rule-based reflection"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "math-verify>=0.5.2",
]

[project.optional-dependencies]
gen = ["torch>=2.4", "transformers>=4.44", "accelerate>=0.33"]
vllm = ["vllm>=0.6.0"]

[tool.setuptools.packages.find]
include = ["wrb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
